name: Update financial data # v2 categorized metrics

on:
  push:
    paths:
      - "scripts/update_financials.py"
      - ".github/workflows/financials.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: financial-data-update
  cancel-in-progress: false

jobs:
  update-financials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull SEC financial data
        env:
          SEC_USER_AGENT: "Portfolio OS research app contact@example.com"
        run: python scripts/update_financials.py

      - name: Commit updated data
        run: |
          git config user.name "portfolio-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add financials.json
          if git diff --cached --quiet; then
            echo "No financial data changes."
          else
            git commit -m "Update SEC financial data"
            # financials.json may also have changed in a newer bot commit.
            # Keep this freshly generated file, but rebuild the commit on top
            # of current main so overlapping generated-data commits cannot conflict.
            git fetch origin main
            git reset --mixed origin/main
            git add financials.json
            git commit -m "Update SEC financial data"
            git push
          fi

      # GITHUB_TOKEN pushes do not trigger a second workflow run. Deploy the
      # freshly generated working tree directly so financial updates reach
      # GitHub Pages in the same run.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
